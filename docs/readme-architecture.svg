<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">Fake News Detection workflow</title><desc id="d">Classify news text with TF-IDF features and a Logistic Regression model.</desc><rect width="1200" height="390" rx="18" fill="#F4F2EE"/><text x="56" y="42" fill="#B45B45" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">SYSTEM FLOW / ANIMATED</text><text x="56" y="80" fill="#28312D" font-family="Arial,sans-serif" font-size="26" font-weight="700">Fake News Detection</text><text x="56" y="108" fill="#737A73" font-family="Arial,sans-serif" font-size="14">Classify news text with TF-IDF features and a Logistic Regression model.</text><line x1="56" y1="128" x2="1144" y2="128" stroke="#DADDD5"/><path d="M 288 236 H 334" stroke="#737A73" stroke-width="1.8"/><path d="M 328 231 L 334 236 L 328 241" fill="none" stroke="#737A73" stroke-width="1.8"/><path d="M 576 236 H 622" stroke="#737A73" stroke-width="1.8"/><path d="M 616 231 L 622 236 L 616 241" fill="none" stroke="#737A73" stroke-width="1.8"/><path d="M 864 236 H 910" stroke="#737A73" stroke-width="1.8"/><path d="M 904 231 L 910 236 L 904 241" fill="none" stroke="#737A73" stroke-width="1.8"/><g><rect x="56" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#DADDD5" stroke-width="1.4"/><rect x="56" y="154" width="224" height="5" rx="2.5" fill="#B45B45"/><text x="72" y="184" fill="#B45B45" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">ARTICLE</text><text x="72" y="219" fill="#28312D" font-family="Arial,sans-serif" font-size="16" font-weight="700">News text</text><text x="72" y="248" fill="#737A73" font-family="Arial,sans-serif" font-size="12">Paste the text to classify.</text><circle cx="260" cy="179" r="4" fill="#B45B45"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle></g><g><rect x="344" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#DADDD5" stroke-width="1.4"/><rect x="344" y="154" width="224" height="5" rx="2.5" fill="#617C68"/><text x="360" y="184" fill="#617C68" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">FEATURES</text><text x="360" y="219" fill="#28312D" font-family="Arial,sans-serif" font-size="16" font-weight="700">TF-IDF</text><text x="360" y="248" fill="#737A73" font-family="Arial,sans-serif" font-size="12">Convert words into numeric features.</text><circle cx="548" cy="179" r="4" fill="#617C68"><animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/></circle></g><g><rect x="632" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#DADDD5" stroke-width="1.4"/><rect x="632" y="154" width="224" height="5" rx="2.5" fill="#B79A62"/><text x="648" y="184" fill="#B79A62" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">CLASSIFIER</text><text x="648" y="219" fill="#28312D" font-family="Arial,sans-serif" font-size="16" font-weight="700">Logistic Regression</text><text x="648" y="248" fill="#737A73" font-family="Arial,sans-serif" font-size="12">Predict the trained label.</text><circle cx="836" cy="179" r="4" fill="#B79A62"><animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/></circle></g><g><rect x="920" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#DADDD5" stroke-width="1.4"/><rect x="920" y="154" width="224" height="5" rx="2.5" fill="#B45B45"/><text x="936" y="184" fill="#B45B45" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">OUTPUT</text><text x="936" y="219" fill="#28312D" font-family="Arial,sans-serif" font-size="16" font-weight="700">Label + score</text><text x="936" y="248" fill="#737A73" font-family="Arial,sans-serif" font-size="12">Review the prediction in the app.</text><circle cx="1124" cy="179" r="4" fill="#B45B45"><animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/></circle></g><circle r="4.5" fill="#617C68"><animateMotion dur="7s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle><circle r="3" fill="#B79A62"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle><text x="56" y="358" fill="#737A73" font-family="Arial,sans-serif" font-size="12">Moving markers show the data path. Open architecture.html for clickable stage details.</text></svg>