<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="366" viewBox="0 0 1200 366" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Fake News Detection Architecture Architecture</title>
  <desc id="svg-desc">System Architecture Layers</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120E08"/>
      <stop offset="100%" stop-color="#1C1710"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C1710"/>
      <stop offset="100%" stop-color="#120E08"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="366" rx="16" fill="url(#bgGrad)" stroke="#2E2419" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)"/>
  <text x="48" y="48" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">SYSTEM ARCHITECTURE</text>
  <text x="48" y="72" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Fake News Detection Architecture</text>
  <g filter="url(#glow)">
    <rect x="48" y="104" width="1104" height="68" rx="10" fill="#1C1710" stroke="#2E2419" stroke-width="1.2"/>
    <rect x="48" y="104" width="8" height="68" rx="3" fill="#F59E0B"/>
    <text x="76" y="132" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Data</text>
    <text x="76" y="154" fill="#D97706" font-family="system-ui, -apple-system, sans-serif" font-size="13">CSV labels</text>
  </g>
  <g filter="url(#glow)">
    <rect x="48" y="186" width="1104" height="68" rx="10" fill="#1C1710" stroke="#2E2419" stroke-width="1.2"/>
    <rect x="48" y="186" width="8" height="68" rx="3" fill="#FBBF24"/>
    <text x="76" y="214" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Model</text>
    <text x="76" y="236" fill="#D97706" font-family="system-ui, -apple-system, sans-serif" font-size="13">TF-IDF + LR</text>
  </g>
  <g filter="url(#glow)">
    <rect x="48" y="268" width="1104" height="68" rx="10" fill="#1C1710" stroke="#2E2419" stroke-width="1.2"/>
    <rect x="48" y="268" width="8" height="68" rx="3" fill="#38BDF8"/>
    <text x="76" y="296" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">UI</text>
    <text x="76" y="318" fill="#D97706" font-family="system-ui, -apple-system, sans-serif" font-size="13">Streamlit</text>
  </g>
