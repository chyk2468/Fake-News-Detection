    <text x="68" y="188" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">✓</text>
    <text x="86" y="188" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">CSVs</text>
    <text x="68" y="216" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">✓</text>
    <text x="86" y="216" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Streamlit</text>
